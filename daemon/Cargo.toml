[package]
name = "nyaa-paperd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
nix = { version = "0.32", features = ["signal", "process"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "process", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.3", features = ["tokio"] }
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"